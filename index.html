<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>techsverre</title>
<style>
  :root{
    --deep: #030816;
    --blue-1: #061638;
    --blue-2: #0b2a63;
    --glow: #4d9fff;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.14);
    --text: #eaf2ff;
    --text-dim: rgba(234,242,255,0.62);
    --avatar-size: 108px;
    --banner-height: 130px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background:var(--deep);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow-x:hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    position:relative;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 20% 15%, rgba(77,159,255,0.25), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(26,79,160,0.35), transparent 50%),
      linear-gradient(180deg, var(--deep) 0%, var(--blue-1) 45%, var(--blue-2) 100%);
    z-index:0;
    animation: drift 18s ease-in-out infinite alternate;
  }

  @keyframes drift{
    0%{ filter: hue-rotate(0deg) brightness(1); }
    100%{ filter: hue-rotate(8deg) brightness(1.08); }
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index:1;
    mix-blend-mode: overlay;
  }

  .card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:400px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--glass-border);
    border-radius:28px;
    overflow:hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: rise 0.7s cubic-bezier(.2,.9,.25,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---- BANNER PHOTO ----
     Drop a file named "banner.jpg" next to this index.html and it
     will show automatically. Until then a blue gradient placeholder
     is shown instead. Swap the filename below if you want a
     different name/format. */
  .banner{
    height: var(--banner-height);
    width:100%;
    background-image: url('banner.jpg'), linear-gradient(135deg, #12336b, #061638 70%);
    background-size: cover, cover;
    background-position: center, center;
  }

  .content{
    text-align:center;
    padding: 0 28px 32px;
  }

  /* avatar sits half on the banner photo, half on the glass card below */
  .avatar-wrap{
    position:relative;
    height:0;
  }

  .avatar{
    width: var(--avatar-size);
    height: var(--avatar-size);
    position:absolute;
    left:50%;
    top: calc(var(--avatar-size) / -2);
    transform: translateX(-50%);
    border-radius:50%;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(145deg, rgba(77,159,255,0.35), rgba(255,255,255,0.05));
    border: 3px solid rgba(255,255,255,0.9);
    box-shadow: 0 0 0 1px rgba(77,159,255,0.15), 0 0 34px rgba(77,159,255,0.35);
  }

  /* ---- AVATAR IMAGE ----
     Drop a file named "avatar.jpg" next to this index.html to
     replace the "TS" placeholder with your own photo/logo. */
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .avatar .fallback-initials{
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size:34px;
    letter-spacing:2px;
    color: #fff;
  }

  .body-inner{
    padding-top: calc(var(--avatar-size) / 2 + 18px);
  }

  .links{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-bottom:30px;
  }

  .links a{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    color: var(--text);
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .links a svg{ width:20px; height:20px; }

  .links a:hover, .links a:focus-visible{
    transform: translateY(-3px);
    outline: none;
  }

  .links a.yt:hover{ background: rgba(255,60,60,0.15); border-color: rgba(255,60,60,0.45); box-shadow: 0 0 18px rgba(255,60,60,0.35); }
  .links a.tt:hover{ background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); box-shadow: 0 0 18px rgba(255,255,255,0.25); }
  .links a.dc:hover{ background: rgba(88,101,242,0.2); border-color: rgba(88,101,242,0.5); box-shadow: 0 0 18px rgba(88,101,242,0.4); }
  .links a.xt:hover{ background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); box-shadow: 0 0 18px rgba(255,255,255,0.25); }
  .links a.gh:hover{ background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.45); box-shadow: 0 0 18px rgba(255,255,255,0.2); }

  @media (max-width:400px){
    .links{ gap:12px; }
    .links a{ width:42px; height:42px; }
  }

  /* ---- HAMBURGER MENU ---- */
  .menu-btn{
    position:fixed;
    top:22px;
    right:22px;
    z-index:20;
    width:46px;
    height:46px;
    border-radius:14px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border:1px solid var(--glass-border);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    cursor:pointer;
  }

  .menu-btn span{
    width:20px;
    height:2px;
    background: var(--text);
    border-radius:2px;
    transition: transform 0.25s ease, opacity 0.2s ease;
  }

  .menu-overlay{
    position:fixed;
    inset:0;
    z-index:30;
    background: rgba(3,8,22,0.55);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.3s ease;
  }

  .menu-overlay.open{
    opacity:1;
    pointer-events:auto;
  }

  .menu-close{
    position:absolute;
    top:22px;
    right:22px;
    width:46px;
    height:46px;
    border-radius:14px;
    background: var(--glass);
    border:1px solid var(--glass-border);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color: var(--text);
  }

  .menu-close svg{ width:20px; height:20px; }

  .menu-links{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:34px;
    transform: translateY(14px);
    opacity:0;
    transition: transform 0.35s ease 0.05s, opacity 0.35s ease 0.05s;
  }

  .menu-overlay.open .menu-links{
    transform: translateY(0);
    opacity:1;
  }

  .menu-links a{
    color: var(--text);
    text-decoration:none;
    font-size:32px;
    font-weight:800;
    letter-spacing:-0.5px;
    transition: color 0.2s ease, text-shadow 0.2s ease;
  }

  .menu-links a:hover, .menu-links a:focus-visible{
    color: var(--glow);
    text-shadow: 0 0 22px rgba(77,159,255,0.6);
    outline:none;
  }

  h1{
    text-align:left;
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.5px;
    margin-bottom:12px;
  }

  p.intro{
    text-align:left;
    font-size:15.5px;
    line-height:1.5;
    color: var(--text-dim);
    margin-bottom:26px;
  }

  p.intro strong{ color: var(--text); font-weight:600; }

  .fact{
    text-align:right;
    font-size:13.5px;
    color: rgba(234,242,255,0.5);
    line-height:1.5;
  }

  .fact strong{
    display:block;
    color: var(--glow);
    font-weight:600;
    font-size:14.5px;
  }

  @media (max-width:380px){
    .content{ padding:0 22px 26px; }
    h1{ font-size:26px; }
  }
</style>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const menuClose = document.getElementById('menuClose');
  const menuOverlay = document.getElementById('menuOverlay');

  function openMenu(){
    menuOverlay.classList.add('open');
    menuBtn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }

  function closeMenu(){
    menuOverlay.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  menuBtn.addEventListener('click', openMenu);
  menuClose.addEventListener('click', closeMenu);

  menuOverlay.addEventListener('click', (e) => {
    if (e.target === menuOverlay) closeMenu();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
  });
</script>
